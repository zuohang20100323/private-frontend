<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>消费记录</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>💰 消费记录</h2>
    <p class="subtitle">记下每一笔花销～</p>
    
    <div class="card">
      <div class="form-group">
        <input type="number" id="amount" placeholder="金额（元）" step="0.01">
      </div>
      <div class="form-group">
        <input type="text" id="category" placeholder="分类（如：吃饭/交通/购物）">
      </div>
      <div class="form-group">
        <input type="text" id="note" placeholder="备注（可选）">
      </div>
      <button id="saveBtn">记录消费</button>
    </div>
    
    <h3>最近消费：</h3>
    <div id="spendingList" class="record-list"></div>
    
    <a href="index.html" class="back-link">← 返回首页</a>
  </div>
  
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js'
    const supabase = createClient('https://olgvyllnrrruxljzejdl.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sZ3Z5bGxucnJydXhsanplamRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NjU0MzQsImV4cCI6MjEwMTA0MTQzNH0.wwV1lRi2OccQ3PmYMJDfF8jIAQ6PwYEexhi57Pm4xz4')
    
    async function loadSpending() {
      const { data, error } = await supabase.from('spending').select('*').order('created_at', { ascending: false }).limit(20)
      if (error) { alert('读取失败'); return }
      
      const list = document.getElementById('spendingList')
      if (data.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="emoji">💳</div><p>还没有消费记录哦～</p></div>'
        return
      }
      
      list.innerHTML = ''
      data.forEach(s => {
        const div = document.createElement('div')
        div.className = 'record-item'
        div.innerHTML = `
          <div class="time">${s.created_at.slice(0,16)}</div>
          <div class="content">
            <span class="amount">${s.amount}元</span>
            <span class="category-tag">${s.category || '未分类'}</span>
            ${s.note ? `<br><small style="color: var(--text-light)">${s.note}</small>` : ''}
          </div>
        `
        list.appendChild(div)
      })
    }
    
    document.getElementById('saveBtn').onclick = async () => {
      const amount = document.getElementById('amount').value
      if (!amount) return alert('写个金额呀')
      
      await supabase.from('spending').insert([{ 
        amount: parseFloat(amount),
        category: document.getElementById('category').value,
        note: document.getElementById('note').value
      }])
      
      document.getElementById('amount').value = ''
      document.getElementById('category').value = ''
      document.getElementById('note').value = ''
      loadSpending()
    }
    
    loadSpending()
  </script>
</body>
</html>
