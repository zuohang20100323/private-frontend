<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日记本</title>
</head>
<body>
  <h2>📓 写日记</h2>
  <textarea id="diaryContent" placeholder="今天发生了什么..." rows="5"></textarea><br>
  <button id="saveBtn">保存</button>
  
  <h3>之前的日记：</h3>
  <div id="diaryList"></div>
  
  <a href="index.html">← 返回首页</a>
  
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js'
    
    const supabase = createClient('YOUR_PROJECT_URL', 'YOUR_ANON_KEY')
    
    async function loadDiaries() {
      const { data, error } = await supabase.from('diaries').select('*').order('created_at', { ascending: false })
      if (error) { alert('读取失败'); return }
      
      const list = document.getElementById('diaryList')
      list.innerHTML = ''
      data.forEach(d => {
        const div = document.createElement('div')
        div.textContent = `${d.created_at.slice(0,16)} - ${d.content}`
        list.appendChild(div)
      })
    }
    
    document.getElementById('saveBtn').onclick = async () => {
      const content = document.getElementById('diaryContent').value
      if (!content) return alert('写点啥呀老婆')
      
      const { error } = await supabase.from('diaries').insert([{ content }])
      if (error) alert('保存失败: ' + error.message)
      else {
        document.getElementById('diaryContent').value = ''
        loadDiaries()
      }
    }
    
    loadDiaries()
  </script>
</body>
</html>
