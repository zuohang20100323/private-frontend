<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日记本</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>📓 写日记</h2>
    <p class="subtitle">把今天的心情藏在这里吧～</p>
    
    <div class="card">
      <div class="form-group">
        <textarea id="diaryContent" placeholder="今天发生了什么..." rows="5"></textarea>
      </div>
      <button id="saveBtn">保存日记</button>
    </div>
    
    <h3>之前的日记：</h3>
    <div id="diaryList" class="record-list"></div>
    
    <a href="index.html" class="back-link">← 返回首页</a>
  </div>
  
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js'
    
    const supabase = createClient('https://olgvyllnrrruxljzejdl.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sZ3Z5bGxucnJydXhsanplamRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NjU0MzQsImV4cCI6MjEwMTA0MTQzNH0.wwV1lRi2OccQ3PmYMJDfF8jIAQ6PwYEexhi57Pm4xz4')
    
    async function loadDiaries() {
      const { data, error } = await supabase.from('diaries').select('*').order('created_at', { ascending: false })
      if (error) { alert('读取失败'); return }
      
      const list = document.getElementById('diaryList')
      if (data.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="emoji">📝</div><p>还没有日记哦，来写第一篇吧～</p></div>'
        return
      }
      
      list.innerHTML = ''
      data.forEach(d => {
        const div = document.createElement('div')
        div.className = 'record-item'
        div.innerHTML = `
          <div class="time">${d.created_at.slice(0,16)}</div>
          <div class="content">${d.content}</div>
        `
        list.appendChild(div)
      })
    }
    
    document.getElementById('saveBtn').onclick = async () => {
      const content = document.getElementById('diaryContent').value
      if (!content) return alert('写点啥呀老婆')
      
      const { error } = await supabase.from('diaries').insert([{ content }])
      if (error) alert('保存失败: ' + error.message)
      else {
        document.getElementById('diaryContent').value = ''
        loadDiaries()
      }
    }
    
    loadDiaries()
  </script>
</body>
</html>
