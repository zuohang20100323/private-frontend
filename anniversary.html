<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>纪念日</title>
</head>
<body>
  <h2>🎂 纪念日</h2>
  
  <input id="title" placeholder="纪念日名称（如：在一起第一天）"><br>
  <input type="date" id="date"><br>
  <textarea id="description" placeholder="描述（可选）"></textarea><br>
  <button id="saveBtn">添加</button>
  
  <h3>所有纪念日：</h3>
  <div id="anniversaryList"></div>
  
  <a href="index.html">← 返回首页</a>
  
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js'
    const supabase = createClient('YOUR_PROJECT_URL', 'YOUR_ANON_KEY')
    
    async function loadAnniversaries() {
      const { data, error } = await supabase.from('anniversaries').select('*').order('date', { ascending: true })
      if (error) { alert('读取失败'); return }
      
      const list = document.getElementById('anniversaryList')
      list.innerHTML = ''
      data.forEach(a => {
        const div = document.createElement('div')
        const targetDate = new Date(a.date)
        const today = new Date()
        const days = Math.floor((targetDate - today) / (1000 * 60 * 60 * 24))
        
        div.textContent = `${a.title} | ${a.date} | ${a.description || ''} | ${days > 0 ? '还有' + days + '天' : days === 0 ? '就是今天！' : '已过' + Math.abs(days) + '天'}`
        list.appendChild(div)
      })
    }
    
    document.getElementById('saveBtn').onclick = async () => {
      const title = document.getElementById('title').value
      const date = document.getElementById('date').value
      if (!title || !date) return alert('写完整呀')
      
      await supabase.from('anniversaries').insert([{ title, date, description: document.getElementById('description').value }])
      document.getElementById('title').value = ''
      document.getElementById('date').value = ''
      document.getElementById('description').value = ''
      loadAnniversaries()
    }
    
    loadAnniversaries()
  </script>
</body>
</html>
