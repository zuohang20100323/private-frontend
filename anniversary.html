<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>纪念日</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>🎂 纪念日</h2>
    <p class="subtitle">记住每一个重要的日子～</p>
    
    <div class="card">
      <div class="form-group">
        <input type="text" id="title" placeholder="纪念日名称（如：在一起第一天）">
      </div>
      <div class="form-group">
        <input type="date" id="date">
      </div>
      <div class="form-group">
        <input type="text" id="description" placeholder="描述（可选）">
      </div>
      <button id="saveBtn">添加纪念日</button>
    </div>
    
    <h3>所有纪念日：</h3>
    <div id="anniversaryList" class="record-list"></div>
    
    <a href="index.html" class="back-link">← 返回首页</a>
  </div>
  
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js'
    const supabase = createClient('https://olgvyllnrrruxljzejdl.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sZ3Z5bGxucnJydXhsanplamRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NjU0MzQsImV4cCI6MjEwMTA0MTQzNH0.wwV1lRi2OccQ3PmYMJDfF8jIAQ6PwYEexhi57Pm4xz4')
    
    async function loadAnniversaries() {
      const { data, error } = await supabase.from('anniversaries').select('*').order('date', { ascending: true })
      if (error) { alert('读取失败'); return }
      
      const list = document.getElementById('anniversaryList')
      if (data.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="emoji">🎈</div><p>还没有纪念日哦，添加一个吧～</p></div>'
        return
      }
      
      list.innerHTML = ''
      data.forEach(a => {
        const div = document.createElement('div')
        div.className = 'record-item'
        const targetDate = new Date(a.date)
        const today = new Date()
        const days = Math.floor((targetDate - today) / (1000 * 60 * 60 * 24))
        
        let countdownText = ''
        let countdownClass = 'countdown'
        if (days > 0) {
          countdownText = `还有 ${days} 天`
        } else if (days === 0) {
          countdownText = '就是今天！🎉'
          countdownClass += ' today'
        } else {
          countdownText = `已过 ${Math.abs(days)} 天`
        }
        
        div.innerHTML = `
          <div class="time">${a.date}</div>
          <div class="content">
            <strong>${a.title}</strong>
            ${a.description ? `<br><small style="color: var(--text-light)">${a.description}</small>` : ''}
            <br><span class="${countdownClass}">${countdownText}</span>
          </div>
        `
        list.appendChild(div)
      })
    }
    
    document.getElementById('saveBtn').onclick = async () => {
      const title = document.getElementById('title').value
      const date = document.getElementById('date').value
      if (!title || !date) return alert('写完整呀')
      
      await supabase.from('anniversaries').insert([{ title, date, description: document.getElementById('description').value }])
      document.getElementById('title').value = ''
      document.getElementById('date').value = ''
      document.getElementById('description').value = ''
      loadAnniversaries()
    }
    
    loadAnniversaries()
  </script>
</body>
</html>
