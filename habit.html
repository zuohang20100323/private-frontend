<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>打卡记录</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>✅ 打卡记录</h2>
    <p class="subtitle">记录每天的习惯～</p>
    
    <div class="card">
      <div class="form-group">
        <input type="text" id="habitName" placeholder="习惯名称（如：早起、读书、运动）">
      </div>
      <button id="addHabit">添加习惯</button>
    </div>
    
    <h3>今天 (${new Date().toLocaleDateString('zh-CN')})：</h3>
    <div id="habitList" class="record-list"></div>
    
    <a href="index.html" class="back-link">← 返回首页</a>
  </div>
  
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js'
    const supabase = createClient('https://olgvyllnrrruxljzejdl.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sZ3Z5bGxucnJydXhsanplamRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NjU0MzQsImV4cCI6MjEwMTA0MTQzNH0.wwV1lRi2OccQ3PmYMJDfF8jIAQ6PwYEexhi57Pm4xz4')
    
    async function loadHabits() {
      const today = new Date().toISOString().slice(0,10)
      const { data, error } = await supabase.from('habits').select('*').eq('date', today)
      if (error) { alert('读取失败'); return }
      
      const list = document.getElementById('habitList')
      if (data.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="emoji">✨</div><p>还没有习惯哦，添加一个吧～</p></div>'
        return
      }
      
      list.innerHTML = ''
      data.forEach(h => {
        const div = document.createElement('div')
        div.className = 'record-item'
        const btnClass = h.completed ? 'habit-btn completed' : 'habit-btn'
        const btnText = h.completed ? '✓ 已完成' : '打卡'
        div.innerHTML = `
          <span>${h.name}</span>
          <button class="${btnClass}" onclick="toggleHabit(${h.id})">${btnText}</button>
        `
        list.appendChild(div)
      })
    }
    
    window.toggleHabit = async (id) => {
      await supabase.from('habits').update({ completed: !document.querySelector(`button[onclick="toggleHabit(${id})"]`).textContent.includes('已完成') }).eq('id', id)
      loadHabits()
    }
    
    document.getElementById('addHabit').onclick = async () => {
      const name = document.getElementById('habitName').value
      if (!name) return alert('写个习惯名称呀')
      
      const today = new Date().toISOString().slice(0,10)
      await supabase.from('habits').insert([{ name, date: today }])
      document.getElementById('habitName').value = ''
      loadHabits()
    }
    
    loadHabits()
  </script>
</body>
</html>
