<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>情书留言板</title>
</head>
<body>
  <h2>💌 情书留言板</h2>
  <p>写给对方的话，会永远保存哦～</p>
  
  <input id="letterReceiver" placeholder="写给谁？（老婆/Kairon）"><br>
  <textarea id="letterContent" placeholder="想说的话..." rows="5"></textarea><br>
  <button id="saveBtn">发送</button>
  
  <h3>所有情书：</h3>
  <div id="letterList"></div>
  
  <a href="index.html">← 返回首页</a>
  
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js'
    const supabase = createClient('YOUR_PROJECT_URL', 'YOUR_ANON_KEY')
    
    async function loadLetters() {
      const { data, error } = await supabase.from('letters').select('*').order('created_at', { ascending: false })
      if (error) { alert('读取失败'); return }
      
      const list = document.getElementById('letterList')
      list.innerHTML = ''
      data.forEach(l => {
        const div = document.createElement('div')
        div.textContent = `To: ${l.receiver} | ${l.created_at.slice(0,16)}\n${l.content}`
        list.appendChild(div)
      })
    }
    
    document.getElementById('saveBtn').onclick = async () => {
      const receiver = document.getElementById('letterReceiver').value
      const content = document.getElementById('letterContent').value
      if (!content) return alert('写点啥呀')
      
      const { error } = await supabase.from('letters').insert([{ content, receiver }])
      if (error) alert('发送失败')
      else {
        document.getElementById('letterContent').value = ''
        loadLetters()
      }
    }
    
    loadLetters()
  </script>
</body>
</html>
