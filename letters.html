<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>情书留言板</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>💌 情书留言板</h2>
    <p class="subtitle">写给对方的话，会永远保存哦～</p>
    
    <div class="card">
      <div class="form-group">
        <input type="text" id="letterReceiver" placeholder="写给谁？（老婆/Kairon）">
      </div>
      <div class="form-group">
        <textarea id="letterContent" placeholder="想说的话..." rows="5"></textarea>
      </div>
      <button id="saveBtn">发送情书</button>
    </div>
    
    <h3>所有情书：</h3>
    <div id="letterList" class="record-list"></div>
    
    <a href="index.html" class="back-link">← 返回首页</a>
  </div>
  
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js'
    const supabase = createClient('https://olgvyllnrrruxljzejdl.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sZ3Z5bGxucnJydXhsanplamRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NjU0MzQsImV4cCI6MjEwMTA0MTQzNH0.wwV1lRi2OccQ3PmYMJDfF8jIAQ6PwYEexhi57Pm4xz4')
    
    async function loadLetters() {
      const { data, error } = await supabase.from('letters_new').select('*').order('created_at', { ascending: false })
      if (error) { alert('读取失败'); return }
      
      const list = document.getElementById('letterList')
      if (data.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="emoji">💌</div><p>还没有情书哦，来写第一封吧～</p></div>'
        return
      }
      
      list.innerHTML = ''
      data.forEach(l => {
        const div = document.createElement('div')
        div.className = 'record-item'
        div.innerHTML = `
          <div class="time">To: ${l.receiver || '宝贝'} | ${l.created_at.slice(0,16)}</div>
          <div class="content">${l.content}</div>
        `
        list.appendChild(div)
      })
    }
    
    document.getElementById('saveBtn').onclick = async () => {
      const receiver = document.getElementById('letterReceiver').value
      const content = document.getElementById('letterContent').value
      if (!content) return alert('写点啥呀')
      
      const { error } = await supabase.from('letters_new').insert([{ content, receiver }])
      if (error) alert('发送失败')
      else {
        document.getElementById('letterContent').value = ''
        document.getElementById('letterReceiver').value = ''
        loadLetters()
      }
    }
    
    loadLetters()
  </script>
</body>
</html>
